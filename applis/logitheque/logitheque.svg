<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Icône de la Logithèque : un sac de verre lumineux (les yeux de Robbie), sur une tuile de nuit -->
  <defs>
    <linearGradient id="nuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16305e"/>
      <stop offset="1" stop-color="#070d1f"/>
    </linearGradient>
    <linearGradient id="sac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff0ff"/>
      <stop offset="1" stop-color="#2a8de0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#38e8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38e8ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tuile"><rect x="8" y="8" width="112" height="112" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#tuile)">
    <rect x="8" y="8" width="112" height="112" fill="url(#nuit)"/>
    <circle cx="64" cy="70" r="52" fill="url(#halo)"/>
    <path d="M50 44v-5a14 14 0 0 1 28 0v5" fill="none" stroke="#bff7ff" stroke-width="6" stroke-linecap="round"/>
    <path d="M34 44h60l-4.5 52a6 6 0 0 1-6 5.5H44.5a6 6 0 0 1-6-5.5z" fill="url(#sac)"/>
    <path d="M34 44h60l-1 11H35z" fill="#ffffff" opacity="0.25"/>
    <rect x="50" y="63" width="9" height="15" rx="4.5" fill="#06121f"/>
    <rect x="69" y="63" width="9" height="15" rx="4.5" fill="#06121f"/>
  </g>
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
</svg>
