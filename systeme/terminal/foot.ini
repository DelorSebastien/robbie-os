# Terminal de Robbie OS (foot) : verre bleu nuit comme les autres fenêtres, police JetBrains Mono
# (puis Symbols Nerd Font pour les pastilles de l'invite, avant les polices du système),
# couleurs de Robbie OS, marges confortables, curseur barre cyan qui clignote.
# (version claire : foot-clair.ini, choisie par l'interface selon le thème)

[main]
font=JetBrains Mono:size=11,Symbols Nerd Font:size=11
font-bold=JetBrains Mono:weight=bold:size=11,Symbols Nerd Font:size=11
pad=18x16
dpi-aware=no
title=Terminal

[bell]
urgent=no
visual=yes

[scrollback]
lines=10000
indicator-position=relative

[cursor]
style=beam
blink=yes
beam-thickness=1.6
color=0a1224 5ee7ff

[mouse]
hide-when-typing=yes

[colors]
alpha=0.88
background=0a1224
foreground=e6edf7
# noir, rouge, vert, jaune, bleu, violet, cyan, blanc
regular0=1b2438
regular1=ff6b8b
regular2=5ef0a8
regular3=ffd27a
regular4=5ea8ff
regular5=b98cff
regular6=5ee7ff
regular7=c8d3e6
bright0=4a5670
bright1=ff8fa8
bright2=8af7c0
bright3=ffe2a3
bright4=8cc2ff
bright5=d0b0ff
bright6=9af1ff
bright7=ffffff
selection-foreground=ffffff
selection-background=24507a
urls=5ee7ff
scrollback-indicator=0a1224 5ee7ff
