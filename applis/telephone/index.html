<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'">
    <title>Téléphone</title>
    <link rel="stylesheet" href="./telephone.css">
</head>
<body>
    <!-- À gauche : Messages ou Appels, les liaisons (téléphone, Robbie OS), la liste -->
    <aside class="gauche">
        <div class="onglets" role="tablist">
            <button class="onglet on" data-vue="messages" data-icon="message" role="tab">Messages</button>
            <button class="onglet" data-vue="appels" data-icon="phone" role="tab">Appels</button>
        </div>

        <label class="recherche" data-messages><span data-icon="search"></span><input id="recherche" placeholder="Rechercher une conversation" aria-label="Rechercher une conversation" autocomplete="off" spellcheck="false"></label>
        <div class="liaisons" data-messages>
            <button class="liaison" id="liaison-telephone"><i class="point"></i><span><b id="telephone-nom">Téléphone</b><span id="telephone-etat">Pas relié</span></span></button>
            <button class="liaison robbie" id="liaison-robbie"><i class="point"></i><span><b>Robbie OS</b><span id="robbie-etat">En ligne</span></span><span class="pastille-demandes" id="demandes" hidden></span></button>
        </div>

        <div class="filtres" data-appels hidden>
            <button class="filtre on" data-filtre="tous">Tous</button>
            <button class="filtre" data-filtre="manques" id="filtre-manques">Manqués</button>
        </div>

        <nav class="liste" id="liste" aria-label="Conversations"></nav>
        <button class="nouveau" id="nouveau" data-icon="plus" data-messages>Nouveau message</button>
    </aside>

    <main class="centre">
        <!-- Une conversation -->
        <section class="vue-messages" id="vue-messages">
            <div class="vide" id="fil-vide">
                <span data-icon="message"></span>
                <b>Tes messages</b>
                <p>Tes SMS passent par ton téléphone relié ; les messages Robbie OS vont directement aux ordinateurs de tes proches.</p>
            </div>
            <header class="tete-fil" id="tete-fil" hidden>
                <span class="av" id="fil-avatar"></span>
                <span class="fil-titre"><b id="fil-nom"></b><small id="fil-details"></small></span>
                <button class="btn" id="fil-appeler" data-icon="phone" aria-label="Appel vocal">Appeler</button>
                <button class="btn" id="fil-video" data-icon="video" aria-label="Appel vidéo">Vidéo</button>
                <button class="btn carre" id="fil-fiche" data-icon="personne" aria-label="Fiche du contact"></button>
            </header>
            <div class="nouveau-message" id="nouveau-message" hidden>
                <label><span>À :</span><input id="destinataire" placeholder="Nom ou numéro" autocomplete="off" spellcheck="false" aria-label="Destinataire"></label>
                <div class="suggestions-destinataires" id="destinataires"></div>
            </div>
            <div class="bulles" id="bulles"></div>
            <div class="propositions" id="propositions" hidden></div>
            <footer class="saisie" id="saisie" hidden>
                <div class="canal-zone">
                    <button class="btn canal" id="canal" aria-haspopup="menu"><span id="canal-nom">Robbie OS</span><span data-icon="chevron"></span></button>
                    <div class="menu" id="menu-canal" role="menu" hidden></div>
                </div>
                <label class="champ">
                    <input id="texte" placeholder="Écrire…" aria-label="Message" autocomplete="off">
                    <button class="joindre" id="joindre" data-icon="trombone" aria-label="Joindre un fichier"></button>
                </label>
                <button class="envoyer" id="envoyer" data-icon="envoyer" aria-label="Envoyer"></button>
            </footer>
            <div class="piece-prete" id="piece-prete" hidden></div>
        </section>

        <!-- Appels : favoris, numéro, clavier -->
        <section class="vue-appels" id="vue-appels" hidden>
            <div class="favoris" id="favoris"></div>
            <div class="numero-zone">
                <div class="numero"><input id="numero" aria-label="Numéro à appeler" inputmode="tel" autocomplete="off" spellcheck="false"></div>
                <span class="numero-qui" id="numero-qui"></span>
            </div>
            <div class="clavier" id="clavier"></div>
            <div class="actions-appel">
                <span class="espace"></span>
                <button class="appeler" id="appeler" data-icon="phone" aria-label="Appeler"></button>
                <button class="rond" id="effacer" data-icon="effacer" aria-label="Effacer"></button>
            </div>
            <span class="appel-via" id="appel-via"><i class="point"></i><span></span></span>
        </section>
    </main>

    <div class="voile" id="voile" hidden></div>
    <div class="message-flash" id="flash" hidden></div>

    <script src="../../interface/js/icones.js"></script>
    <script src="./telephone.js"></script>
</body>
</html>
