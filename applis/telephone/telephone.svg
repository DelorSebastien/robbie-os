<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Icône du Téléphone : un combiné de lumière verte et une bulle de message, sur une tuile de nuit -->
  <defs>
    <linearGradient id="nuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16305e"/>
      <stop offset="1" stop-color="#070d1f"/>
    </linearGradient>
    <linearGradient id="combine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6ffe6"/>
      <stop offset="1" stop-color="#3ed79a"/>
    </linearGradient>
    <linearGradient id="bulle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ff4ff"/>
      <stop offset="1" stop-color="#2a8de0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.4" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#7ff0bb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7ff0bb" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tuile"><rect x="8" y="8" width="112" height="112" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#tuile)">
    <rect x="8" y="8" width="112" height="112" fill="url(#nuit)"/>
    <circle cx="52" cy="74" r="52" fill="url(#halo)"/>
    <path d="M70 24h32a8 8 0 0 1 8 8v20a8 8 0 0 1-8 8H86l-12 9v-9h-4a8 8 0 0 1-8-8V32a8 8 0 0 1 8-8z" fill="url(#bulle)"/>
    <circle cx="76" cy="42" r="3.4" fill="#06121f"/>
    <circle cx="86" cy="42" r="3.4" fill="#06121f"/>
    <circle cx="96" cy="42" r="3.4" fill="#06121f"/>
    <path d="M30 44h14l7 17-8.5 5a38 38 0 0 0 17 17l5-8.5 17 7v14a7 7 0 0 1-7 7C45 103 23 81 23 51a7 7 0 0 1 7-7z" fill="url(#combine)"/>
  </g>
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
</svg>
