<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: fond:; style-src 'self' 'unsafe-inline'">
    <title>Robbie OS</title>
    <link rel="stylesheet" href="./styles/horizon.css">
    <link rel="stylesheet" href="./styles/panneaux.css">
    <link rel="stylesheet" href="./styles/reglages.css">
    <link rel="stylesheet" href="./styles/theme-clair.css">
</head>
<body class="demarrage">
    <!-- Fond d'écran : des images superposées qui se fondent l'une dans l'autre (js/fond.js) -->
    <div class="fond" id="fond" aria-hidden="true"></div>

    <!-- Dégradés des icônes du dock (une teinte par appli, même trait pour toutes) -->
    <svg class="degrades" width="0" height="0" aria-hidden="true">
        <defs>
            <linearGradient id="d-bleu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe0ff"/><stop offset="1" stop-color="#3b8cf6"/></linearGradient>
            <linearGradient id="d-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc08a"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>
            <linearGradient id="d-argent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f6ff"/><stop offset="1" stop-color="#9fb0cc"/></linearGradient>
            <linearGradient id="d-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcb0ff"/><stop offset="1" stop-color="#8b4dff"/></linearGradient>
            <linearGradient id="d-cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8f6ff"/><stop offset="1" stop-color="#4fcfff"/></linearGradient>
            <linearGradient id="d-vert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c6ffe6"/><stop offset="1" stop-color="#3ed79a"/></linearGradient>
        </defs>
    </svg>

    <!-- Barre latérale : notifications, contacts, raccourcis -->
    <!-- Robbie : sa propre capsule, posée au-dessus de la barre latérale ; un clic ouvre son panneau (Super) -->
    <button class="robbie-tete" id="robbie-tete" aria-label="Robbie" title="Robbie (Super)"><span class="visage"></span></button>

    <aside class="laterale" aria-label="Barre latérale">
        <!-- Bureaux virtuels : un point par bureau, l'actif est allumé (Super + 1…4) -->
        <div class="bureaux" id="bureaux" role="group" aria-label="Bureaux virtuels"></div>
        <button class="lat-bouton" data-panneau data-action="notifications" data-icon="bell" aria-label="Notifications" title="Notifications (Super+N)"><span class="pastille" hidden></span></button>
        <!-- Groupes : chacun ouvre son tiroir à côté de la barre (elle ne déborde jamais) -->
        <button class="lat-bouton" data-panneau data-action="contacts" data-icon="users" aria-label="Contacts, messages et appels" title="Contacts, messages et appels"><span class="lat-nombre" id="contacts-nombre" hidden></span></button>
        <button class="lat-bouton" data-panneau data-action="outils" data-icon="grid" aria-label="Outils" title="Outils : aujourd'hui, notes, agenda, capture, presse-papiers"></button>
        <button class="lat-bouton" data-panneau data-action="reglages" data-icon="gear" aria-label="Réglages" title="Réglages (Super+I)"></button>
        <span class="lat-sep lat-bas"></span>
        <button class="lat-bouton" data-panneau data-action="lanceur" data-icon="plus" aria-label="Toutes les applis" title="Toutes les applis (Super+A)"></button>
        <button class="lat-bouton" data-panneau data-action="alimentation" data-icon="power" aria-label="Alimentation" title="Verrouiller, se déconnecter, éteindre…"></button>
    </aside>

    <!-- Dock incurvé, Robbie au centre -->
    <div class="dock-zone">
        <svg class="dock-arc" id="dock-arc" aria-hidden="true">
            <defs>
                <linearGradient id="arc-degrade" x1="0" x2="1">
                    <stop offset="0" style="stop-color: rgb(var(--accent))" stop-opacity="0"/>
                    <stop offset="0.25" style="stop-color: rgb(var(--accent))" stop-opacity="0.55"/>
                    <stop offset="0.5" style="stop-color: rgb(var(--accent))" stop-opacity="1"/>
                    <stop offset="0.75" style="stop-color: rgb(var(--accent))" stop-opacity="0.55"/>
                    <stop offset="1" style="stop-color: rgb(var(--accent))" stop-opacity="0"/>
                </linearGradient>
                <filter id="arc-flou" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
            </defs>
            <path class="arc-halo" filter="url(#arc-flou)"/>
            <path class="arc-ligne"/>
            <path class="arc-flux" pathLength="1"/>
            <path class="arc-flux inverse" pathLength="1"/>
        </svg>
        <div class="dock-points" id="dock-points"></div>
        <nav class="dock" id="dock" aria-label="Dock"></nav>
    </div>

    <!-- Coin : réseau, son, heure -->
    <div class="coin">
        <span class="coin-telephone" id="coin-telephone" hidden><span data-icon="batterie"></span><b></b></span>
        <button class="coin-bouton" id="coin-rapide" data-panneau aria-label="Réglages rapides : réseau et son">
            <span data-icon="wifi" id="coin-reseau"></span>
            <span data-icon="volume" id="coin-son"></span>
        </button>
        <button class="coin-bouton coin-concentration" id="coin-concentration" data-panneau aria-label="Mode concentration" hidden><span data-icon="focus"></span><b id="coin-minuteur">25:00</b></button>
        <span class="coin-sep"></span>
        <button class="coin-bouton coin-horloge" id="coin-heure" data-panneau aria-label="Agenda"><time id="heure">--:--</time><span id="coin-date"></span></button>
    </div>

    <!-- Panneau de Robbie : la conversation, au-dessus du dock -->
    <section class="robbie-panneau" id="robbie-panneau" aria-label="Robbie" hidden>
        <header class="rp-tete">
            <span class="rp-titre">ROBBIE</span>
            <span class="rp-etat" id="rp-etat">PRÊT</span>
            <button class="rp-fermer" id="rp-fermer" data-icon="x" aria-label="Fermer"></button>
        </header>
        <div class="rp-fil" id="rp-fil" aria-live="polite"></div>
        <div class="rp-confirmer" id="rp-confirmer" hidden></div>
        <form class="rp-saisie" id="rp-saisie">
            <input id="rp-texte" placeholder="Écris à Robbie… ou dis « Robbie »" autocomplete="off" aria-label="Message pour Robbie">
            <button type="submit" data-icon="send" aria-label="Envoyer"></button>
        </form>
    </section>

    <!-- Toutes les applis -->
    <section class="panneau panneau-central" id="lanceur" aria-label="Toutes les applis">
        <header class="panneau-tete">
            <span class="panneau-titre">TOUTES LES APPLIS</span>
            <button class="panneau-fermer" data-icon="x" aria-label="Fermer"></button>
        </header>
        <label class="lanceur-recherche">
            <span data-icon="search"></span>
            <input id="lanceur-recherche" placeholder="Rechercher une appli" autocomplete="off" aria-label="Rechercher une appli">
        </label>
        <div class="lanceur-grille" id="lanceur-grille"></div>
        <p class="panneau-astuce">Clic droit sur une appli pour l'épingler au dock</p>
    </section>

    <div class="toasts" id="toasts"></div>

    <!-- Visage de Robbie : face.js le cherche au chargement, le dock le place dans sa tuile -->
    <canvas id="face"></canvas>

    <script src="../robbie/visage/face.js"></script>
    <script src="./js/icones.js"></script>
    <script src="./js/outils.js"></script>
    <script src="./js/soleil.js"></script>
    <script src="./js/fond.js"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/disposition.js"></script>
    <script src="./js/bureaux.js"></script>
    <script src="./js/ambiance.js"></script>
    <script src="./js/compte.js"></script>
    <script src="./js/panneaux.js"></script>
    <script src="./js/dock.js"></script>
    <script src="./js/lanceur.js"></script>
    <script src="./js/laterale.js"></script>
    <script src="./js/contacts.js"></script>
    <script src="./js/notifications.js"></script>
    <script src="./js/reglages.js"></script>
    <script src="./js/coin.js"></script>
    <script src="./js/robbie-panneau.js"></script>
    <script src="./js/recherche.js"></script>
    <script src="./js/presse-papiers.js"></script>
    <script src="./js/concentration.js"></script>
    <script src="./js/telephone.js"></script>
    <script src="./js/aujourdhui.js"></script>
    <script src="./js/suggestions.js"></script>
</body>
</html>
